<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090E" />
    <title>You are offline | LIFE Spoken English</title>
    <link rel="icon" href="/icon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #d6d3d1; text-align: center;
        background: radial-gradient(40rem 30rem at 50% 0%, rgb(234 138 42 / 0.18), transparent 60%), #0b0806;
      }
      main { max-width: 26rem; }
      img { width: 7rem; height: auto; }
      h1 { margin-top: 1.25rem; color: #fff; font-size: 1.6rem; }
      p { margin-top: 0.75rem; line-height: 1.6; }
      .actions { margin-top: 1.75rem; display: grid; gap: 0.75rem; }
      a, button {
        display: block; padding: 0.85rem 1.25rem; border-radius: 999px; font: inherit; font-weight: 600;
        text-decoration: none; cursor: pointer; border: 0;
      }
      .primary { background: linear-gradient(90deg, #ea8a2a, #f9ba49); color: #0b0806; }
      .secondary { background: rgb(28 22 18 / 0.8); color: #fff; border: 1px solid rgb(58 45 36); }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/life-emblem.png" alt="LIFE logo" />
      <h1>You are offline</h1>
      <p>Please check your internet connection. You can still call Mani Sir directly to book your 10 free trial classes.</p>
      <div class="actions">
        <a class="primary" href="tel:+917337412999">Call +91 73374 12999</a>
        <button class="secondary" type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
